resources:
  jobs:
    pipeline_vendas_estoque:
      name: pipeline_vendas_estoque
      description: Executa o pipeline do Desafio Vendas (Bronze → Silver → Gold → Previsão → Governança)
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingestao.ipynb
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/03_silver_tratamento.ipynb
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/04_gold_modelagem.ipynb
        - task_key: previsao
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../notebooks/07_previsao_demanda.ipynb
        - task_key: governanca
          depends_on:
            - task_key: previsao
          notebook_task:
            notebook_path: ../notebooks/08_governanca_metadados.ipynb
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
